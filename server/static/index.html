<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlayWars v3 — 2K eBasketball AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Alpine.js (Safari-compatible) -->
  <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <!-- D3.js for tree visualizations -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Chart.js for bankroll charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

  <!-- ── Toast container ──────────────────────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">ParlayWars <span class="brand-v3">v3</span></span>
    </div>

    <!-- Global search -->
    <div class="global-search-wrap">
      <input
        id="global-search"
        type="text"
        class="global-search"
        placeholder="/ Search players, bets, predictions..."
        x-model="searchQuery"
        @input="onGlobalSearch($event.target.value)"
        @keydown.escape="searchQuery=''; closeSearch()"
        autocomplete="off"
      >
      <div class="search-results" x-show="searchResults.length > 0" x-cloak>
        <template x-for="r in searchResults" :key="r.id">
          <div class="search-result-item" @click="handleSearchResult(r)" x-text="r.label"></div>
        </template>
      </div>
    </div>

    <!-- Desktop tab nav -->
    <nav class="tab-nav" id="desktop-nav">
      <template x-for="tab in tabs" :key="tab.id">
        <button
          class="tab-btn"
          :class="{ active: currentTab === tab.id }"
          @click="switchTab(tab.id)"
          x-text="tab.label"
        ></button>
      </template>
    </nav>

    <div class="header-meta">
      <!-- Live Mode toggle -->
      <button
        class="live-mode-btn"
        :class="{ active: liveMode }"
        @click="toggleLiveMode()"
        :title="liveMode ? 'Live Mode ON — disable to save battery' : 'Live Mode OFF — click to enable auto-refresh'"
      >
        <span x-text="liveMode ? '🔴 LIVE' : '⬜ LIVE'"></span>
      </button>

      <!-- Theme toggle -->
      <button class="theme-toggle" @click="toggleTheme()" :title="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
      </button>

      <!-- Data freshness -->
      <div class="freshness-indicator" :class="freshnessClass" :title="freshnessTitle">
        <span x-text="freshnessLabel"></span>
      </div>

      <!-- Bankroll badge -->
      <span class="bankroll-badge">
        💰 $<span x-text="stats.bankroll?.toFixed(2) || '1000.00'"></span>
      </span>

      <!-- WS status dot -->
      <span class="status-dot" :class="wsConnected ? 'connected' : 'disconnected'"></span>
    </div>
  </header>

  <!-- ── Tab Content ────────────────────────────────────────────────────── -->
  <main class="main-content">

    <!-- Dashboard -->
    <div x-show="currentTab === 'dashboard'" x-cloak>
      <div id="dashboard-root"></div>
    </div>
    <!-- Players -->
    <div x-show="currentTab === 'players'" x-cloak>
      <div id="players-root"></div>
    </div>
    <!-- Predictions -->
    <div x-show="currentTab === 'predictions'" x-cloak>
      <div id="predictions-root"></div>
    </div>
    <!-- H2H -->
    <div x-show="currentTab === 'h2h'" x-cloak>
      <div id="h2h-root"></div>
    </div>
    <!-- Trees -->
    <div x-show="currentTab === 'trees'" x-cloak>
      <div id="trees-root"></div>
    </div>
    <!-- Simulator -->
    <div x-show="currentTab === 'sim'" x-cloak>
      <div id="sim-root"></div>
    </div>
    <!-- Console -->
    <div x-show="currentTab === 'console'" x-cloak>
      <div id="console-root"></div>
    </div>
    <!-- Settings -->
    <div x-show="currentTab === 'settings'" x-cloak>
      <div id="settings-root"></div>
    </div>
    <!-- Export -->
    <div x-show="currentTab === 'export'" x-cloak>
      <div id="export-root"></div>
    </div>

  </main>

  <!-- ── Modal ──────────────────────────────────────────────────────────── -->
  <div class="modal-overlay" x-show="modal.open" @click.self="modal.open=false" x-cloak>
    <div class="modal-box">
      <button class="modal-close" @click="modal.open=false">✕</button>
      <div x-html="modal.content"></div>
    </div>
  </div>

  <!-- ── Mobile Bottom Nav (<768px) ────────────────────────────────────── -->
  <nav class="mobile-bottom-nav" id="mobile-nav">
    <button class="mob-nav-btn" :class="{active:currentTab==='dashboard'}" @click="switchTab('dashboard')">
      <span class="mob-icon">📊</span><span class="mob-label">Home</span>
    </button>
    <button class="mob-nav-btn" :class="{active:currentTab==='players'}" @click="switchTab('players')">
      <span class="mob-icon">👥</span><span class="mob-label">Players</span>
    </button>
    <button class="mob-nav-btn" :class="{active:currentTab==='predictions'}" @click="switchTab('predictions')">
      <span class="mob-icon">🎯</span><span class="mob-label">Predict</span>
    </button>
    <button class="mob-nav-btn" :class="{active:currentTab==='sim'}" @click="switchTab('sim')">
      <span class="mob-icon">💰</span><span class="mob-label">Sim</span>
    </button>
    <!-- More menu -->
    <div class="mob-more-wrap">
      <button class="mob-nav-btn" @click="mobileMenuOpen=!mobileMenuOpen">
        <span class="mob-icon">☰</span><span class="mob-label">More</span>
      </button>
      <div class="mob-more-menu" x-show="mobileMenuOpen" @click.outside="mobileMenuOpen=false" x-cloak>
        <button @click="switchTab('h2h');mobileMenuOpen=false">⚔️ H2H</button>
        <button @click="switchTab('trees');mobileMenuOpen=false">🌳 Trees</button>
        <button @click="switchTab('console');mobileMenuOpen=false">🖥 Console</button>
        <button @click="switchTab('settings');mobileMenuOpen=false">⚙️ Settings</button>
        <button @click="switchTab('export');mobileMenuOpen=false">📥 Export</button>
      </div>
    </div>
  </nav>

  <!-- ── Scripts ─────────────────────────────────────────────────────── -->
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/players.js"></script>
  <script src="/js/trees.js"></script>
  <script src="/js/sim.js"></script>
  <script src="/js/h2h.js"></script>
  <script src="/js/settings.js"></script>

</body>
</html>
