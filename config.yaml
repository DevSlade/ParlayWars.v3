# ParlayWars v3 — Configuration File
# Date: 2026-02-25

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  log_level: "info"

database:
  path: "data/db/parlayWars.db"

cache:
  ttl_seconds: 300          # 5-minute default TTL
  disk_path: "data/cache"

logging:
  level: "INFO"
  file: "data/parlayWars.log"
  ring_buffer_size: 500     # lines kept in memory for Console tab

apis:
  osws:
    base_url: "http://localhost:8001"
    enabled: true
  hudstats:
    base_url: "https://api-h2h.hudstats.com/v1"
    enabled: true
  esportsbattle:
    base_url: "https://basketball.esportsbattle.com/api"
    enabled: true
  odds_api:
    base_url: "https://api.the-odds-api.com/v4"
    key: "b824c5f93dc1f906c306702b7eb1f6fc"
    enabled: true
  betsapi:
    base_url: "https://api.b365api.com"
    token: ""                # optional — $10/mo service
    sport_id: 151
    league_id: 25067
    enabled: false

scheduler:
  live_poll_interval_seconds: 30
  schedule_poll_interval_seconds: 120
  retrain_after_n_matches: 20
  daily_snapshot_hour: 3    # 3 AM UTC daily snapshot

simulation:
  enabled: true
  starting_bankroll: 1000.0
  kelly_fraction: 0.25      # quarter-Kelly
  min_confidence: 0.52      # minimum model confidence to place a bet
  max_parlay_legs: 4
  min_edge_per_leg: 0.03    # 3% minimum edge per parlay leg
  flat_bet_amount: 10.0     # fallback if Kelly gives 0

engines:
  titan:
    enabled: true
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    reg_alpha: 0.1
    reg_lambda: 1.0
  phantom:
    enabled: true
  surge:
    enabled: true
  oracle:
    enabled: true
    hidden_size: 32
